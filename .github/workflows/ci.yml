name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @maf/shared --filter @maf/web test
      - run: pnpm --filter @maf/web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maf
          POSTGRES_PASSWORD: maf
          POSTGRES_DB: maf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maf -d maf_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://maf:maf@localhost:5432/maf_test
      REDIS_URL: redis://localhost:6379
      PUBLIC_ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnop
      DAILY_SEED_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnop
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maf/api test
      - run: pnpm --filter @maf/api build

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile .
